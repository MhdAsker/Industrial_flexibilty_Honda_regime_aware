[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honda-industrial-energy-audit"
version = "0.1.0"
description = "Forensic audit of the reduced Honda R&D Europe energy dataset"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
