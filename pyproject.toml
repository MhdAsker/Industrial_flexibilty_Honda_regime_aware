[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honda-industrial-energy-audit"
version = "0.1.0"
description = "Leakage-safe day-ahead forecasting benchmark for Honda signed grid exchange"
requires-python = ">=3.10"
dependencies = [
  "lxml",
  "matplotlib",
  "numpy",
  "pandas>=2.2,<3",
  "pyarrow",
  "PyYAML",
  "requests",
  "websocket-client",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
