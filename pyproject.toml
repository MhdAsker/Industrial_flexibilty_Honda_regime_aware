[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honda-industrial-energy-audit"
version = "0.1.0"
description = "Leakage-safe industrial-energy forecasting, scenario generation, and decision-value research"
requires-python = ">=3.10"
dependencies = [
  "lxml",
  "matplotlib",
  "numpy",
  "pandas>=2.2,<3",
  "pyarrow",
  "PyYAML",
  "requests",
  "scipy>=1.13,<2",
  "websocket-client",
]

[project.optional-dependencies]
forecasting = [
  "lightgbm>=4.5,<5",
]
test = [
  "pytest>=8,<9",
]
platform = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
kumo = [
  "huggingface-hub>=0.22",
  "psutil>=5.9",
  "torch>=2.7",
  "transformers>=4.36",
]
all = [
  "fastapi>=0.115,<1",
  "lightgbm>=4.5,<5",
  "pytest>=8,<9",
  "uvicorn>=0.34,<1",
]

[project.scripts]
flexlab = "honda.flexlab.cli:main"
shadow-scheduler = "honda.shadow.cli:main"
flexops = "honda.platform.cli:main"
prescriptive-ml = "honda.prescriptive_ml.cli:main"
honda-kumo = "honda.kumo.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
  "external_integrity: checks the state of an independently managed companion repository",
]
