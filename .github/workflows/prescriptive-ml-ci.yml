name: Prescriptive ML CI

on:
  push:
    paths:
      - "src/honda/prescriptive_ml/**"
      - "tests/prescriptive_ml/**"
      - "results/prescriptive_ml/**"
      - "config/prescriptive_ml/**"
      - "pyproject.toml"
      - ".github/workflows/prescriptive-ml-ci.yml"
  pull_request:
    paths:
      - "src/honda/prescriptive_ml/**"
      - "tests/prescriptive_ml/**"
      - "results/prescriptive_ml/**"
      - "config/prescriptive_ml/**"
      - "pyproject.toml"

jobs:
  challenger-controls:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,forecasting]"
      - run: python -m pytest -q -p no:cacheprovider tests/prescriptive_ml
      - run: prescriptive-ml audit
