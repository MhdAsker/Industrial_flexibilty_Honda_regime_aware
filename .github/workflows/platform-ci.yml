name: FlexOps platform CI

on:
  push:
    paths:
      - "src/honda/platform/**"
      - "tests/platform/**"
      - "pyproject.toml"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "src/honda/platform/**"
      - "tests/platform/**"
      - "pyproject.toml"

jobs:
  platform-foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,platform]"
      - run: python -m pytest -q -p no:cacheprovider tests/platform tests/shadow
      - run: flexops --database flexops-ci.sqlite init
      - run: flexops --database flexops-ci.sqlite verify-audit
