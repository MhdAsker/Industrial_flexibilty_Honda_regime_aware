name: Partner-Adaptive Shadow ML CI

on:
  push:
    paths:
      - "src/honda/shadow/**"
      - "tests/shadow/**"
      - "examples/shadow/**"
      - "docs/phase2_shadow_scheduler.md"
      - ".github/workflows/shadow-ml-ci.yml"
  pull_request:
    paths:
      - "src/honda/shadow/**"
      - "tests/shadow/**"
      - "examples/shadow/**"
      - "docs/phase2_shadow_scheduler.md"

jobs:
  shadow-controls:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider tests/shadow
