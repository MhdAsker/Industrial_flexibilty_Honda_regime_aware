name: FlexLab v2 CI

on:
  push:
    paths:
      - "src/honda/flexlab/**"
      - "src/honda/scenarios/calibration.py"
      - "tests/flexlab/**"
      - "examples/flexlab/**"
      - "pyproject.toml"
      - ".github/workflows/flexlab-ci.yml"
  pull_request:
    paths:
      - "src/honda/flexlab/**"
      - "src/honda/scenarios/calibration.py"
      - "tests/flexlab/**"
      - "examples/flexlab/**"
      - "pyproject.toml"

jobs:
  synthetic-e2e:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider tests/flexlab
      - run: flexlab validate --experiment examples/flexlab/synthetic/experiment.yaml
      - run: flexlab run --experiment examples/flexlab/synthetic/experiment.yaml --output flexlab-ci-output
      - run: flexlab reproduce --experiment examples/flexlab/synthetic/experiment.yaml
